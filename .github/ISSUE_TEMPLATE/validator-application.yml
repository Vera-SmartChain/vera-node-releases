name: Validator Application
description: Apply to join the VERA SmartChain Testnet as an active validator
title: "[Validator Application]: "
labels: ["validator-application", "testnet"]
body:
  - type: markdown
    attributes:
      value: |
        ### VERA SmartChain Validator Onboarding Application
        Before submitting this form, ensure you have completed Steps 1 through 5 of the [Joining as a Validator](https://docs.verachain.cloud) guide:
        1. Prepared your Ubuntu 24.04 server with firewall (ports 22 and 26656 open, 8545 closed).
        2. Installed and verified the node software.
        3. Synchronized your node to the chain tip (`vera_cli syncwait`).
        4. Generated your validator key (`sudo vera_cli keygen --out /etc/vera/validator_key.hex`).
        5. Generated your signed application block (`sudo vera_cli apply-validator --key-file /etc/vera/validator_key.hex --operator "<name>"`).
  - type: input
    id: operator
    attributes:
      label: Operator Name / GitHub Handle
      description: Your name, team, or organization handle
      placeholder: "@operator_handle"
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Validator On-Chain Address
      description: The 32-byte hex address generated by vera_cli keygen (starts with 0x)
      placeholder: "0x..."
    validations:
      required: true
  - type: input
    id: public_key
    attributes:
      label: Validator Public Key
      description: The 32-byte Ed25519 public key (starts with 0x)
      placeholder: "0x..."
    validations:
      required: true
  - type: textarea
    id: application_block
    attributes:
      label: Signed Validator Application Block
      description: Paste the exact output generated by 'sudo vera_cli apply-validator --key-file /etc/vera/validator_key.hex --operator "<name>"'
      placeholder: |
        -----BEGIN VERA VALIDATOR APPLICATION-----
        chain_id: vera-testnet-1
        address: 0x...
        public_key: 0x...
        operator: @handle
        timestamp: ...
        signature: 0x...
        -----END VERA VALIDATOR APPLICATION-----
      render: text
    validations:
      required: true
